apiVersion: v1 # Especifica la versión de la API de Kubernetes (v1 es la estándar para objetos básicos).
kind: ConfigMap # Define que el recurso es un ConfigMap, usado para inyectar variables de entorno o archivos.
metadata: # Sección de metadatos para identificar el recurso dentro del clúster.
  name: {{ .Values.postgres.name }}-configmap # Nombre del recurso; se genera dinámicamente usando el valor 'name' del archivo values.yaml de Helm.
  namespace: {{ .Release.Namespace }} # Define el espacio de nombres (namespace) donde se creará el objeto, según el despliegue actual.
data: # Aquí comienzan los pares clave-valor que se guardarán en el ConfigMap.
  POSTGRES_HOST: {{ .Values.postgres.name }} # Define la dirección del servidor de BD (normalmente el nombre del Service de Kubernetes).
  POSTGRES_PORT: {{ .Values.postgres.service.port | quote }} # El puerto de escucha . Se usa 'quote' para asegurar que el número sea tratado como una cadena de texto
  POSTGRES_DB: {{ .Values.postgres.auth.database }} # El nombre de la base de datos específica que se creará o a la que se conectará el sistema.